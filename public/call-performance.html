<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Call performance · DegreeSight</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F7F7F4; color: #1A1A1A; margin: 0; padding: 24px; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 0.5px solid rgba(0,0,0,0.08); background: #fff; border-radius: 14px 14px 0 0; gap: 12px; flex-wrap: wrap; }
  .brand-row { display: flex; align-items: center; gap: 12px; }
  .brand-logo { width: 32px; height: 32px; border-radius: 8px; background: #2D58A8; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
  .brand-title { font-size: 14px; font-weight: 600; }
  .brand-sub   { font-size: 12px; color: #5F5E5A; }
  .header-right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5F5E5A; flex-wrap: wrap; }
  .header-right select { font: inherit; padding: 4px 8px; border: 0.5px solid rgba(0,0,0,0.15); border-radius: 6px; background: #fff; }
  .refresh-btn, .logout { background: transparent; border: 0.5px solid rgba(0,0,0,0.15); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; color: #1A1A1A; text-decoration: none; }
  .tab-panel { background: #fff; padding: 18px; border-radius: 0 0 14px 14px; }
  .panel { background: #fff; border: 0.5px solid rgba(0,0,0,0.08); border-radius: 10px; padding: 14px 16px; }
  .panel-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  .panel-sub { font-size: 11px; color: #888780; margin-top: -8px; margin-bottom: 8px; }
  a { color: #2D58A8; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="/design.css" />
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand-row">
      <div class="brand-logo">DS</div>
      <div>
        <div class="brand-title">Call performance</div>
        <div class="brand-sub" id="sub">Loading…</div>
      </div>
    </div>
    <div class="header-right">
      <select id="rep-select" style="display:none"></select>
      <a class="logout" href="/sales.html">Sales workspace</a>
    </div>
  </div>
  <div class="tab-panel"><div id="cp-root"></div></div>
</div>
<script src="/call-performance.js"></script>
<script>
  (async () => {
    const r = await fetch('/api/me');
    if (!r.ok) { location.href = '/login.html'; return; }
    const me = await r.json();
    document.getElementById('sub').textContent = me.email + ' · scored sales calls, DS Sales Team';
    let selectedOwner = me.owner_id || null;
    const sel = document.getElementById('rep-select');
    if (me.role !== 'sales' && me.reps) {
      sel.innerHTML = me.reps.map(x => `<option value="${x.ownerId}" ${x.ownerId === selectedOwner ? 'selected' : ''}>${x.name}</option>`).join('');
      sel.style.display = '';
      selectedOwner = selectedOwner || (me.reps[0] && me.reps[0].ownerId);
      sel.value = selectedOwner;
    }
    const widget = CallPerf.mount(document.getElementById('cp-root'), { role: me.role, getOwnerId: () => selectedOwner });
    sel.onchange = () => { selectedOwner = sel.value; widget.rerender(); };
  })();
</script>
</body>
</html>
